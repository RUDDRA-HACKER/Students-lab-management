spring.application.name=Student_labmangment_backend

# Test profile uses in-memory H2 so the build can run without MySQL
spring.datasource.url=jdbc:h2:mem:student_lab_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Keep frontend CORS behavior consistent in tests
app.cors.allowed-origins=http://localhost:3000,http://localhost:3002,http://localhost:5173,http://127.0.0.1:3002

