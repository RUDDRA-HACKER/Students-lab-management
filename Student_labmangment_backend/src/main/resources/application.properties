spring.application.name=Lab-manager

# Backend runtime settings
server.port=8080

# Default to embedded H2 so local development does not require Docker/MySQL.
# You can still override with SPRING_DATASOURCE_* env vars for external databases.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/student_lab_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Optional: H2 web console for local debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Comma-separated list of frontend origins allowed to call this API
app.cors.allowed-origins=http://localhost:3000,http://localhost:3002,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:3002
